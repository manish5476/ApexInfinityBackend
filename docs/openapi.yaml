openapi: 3.0.3
info:
  title: Apex Infinity — Enterprise Modular Monolith API
  version: 1.0.0
  description: "

    # Apex Infinity Enterprise API Documentation


    Welcome to the **Apex Infinity** Modular Monolith Platform API
    Documentation.


    ### Architecture Highlights:

    - **Clean Architecture & Domain-Driven Design**: Explicit Application
    Use Cases → Pure Domain Entities → Concrete Mongoose Repositories.

    - **Strict Multi-Tenant Isolation**: Every database query is
    tenant-scoped via the validated JWT token claim. Clients cannot spoof
    tenants via arbitrary request headers.

    - **Real Business Truth**: All metrics and reports are live MongoDB
    aggregations with 0% mock data.

    - **Real-Time WebSockets**: Full Socket.IO server mounted on the same
    HTTP runtime for live chat, presence, and alerts.


    ---


    ### How to Authenticate in Swagger UI:

    1. Navigate to **Authentication & Identity** → `POST /auth/login`.

    2. Click **Try it out** and enter credentials (e.g. email and password).

    3. Copy the returned `token` value from the JSON response body.

    4. Scroll to the top right of this page and click the **Authorize 🔓**
    button.

    5. Enter: `Bearer <your_token>` and click **Authorize**.

    6. All authenticated endpoints will automatically send your token with
    zero manual header typing.

    \    "
  contact:
    name: Apex Platform Engineering
    email: support@apexinfinity.io
    url: https://apexinfinity.io
  license:
    name: Proprietary - Apex Infinity Commercial Edition
servers:
  - url: /api/v1
    description: Current API v1 Base Path
  - url: http://localhost:5000/api/v1
    description: Local Development Server (Port 5000 — Default Frontend Target)
  - url: http://localhost:4000/api/v1
    description: Secondary Development Server (Port 4000)
tags:
  - name: Authentication & Identity
    description: User login, registration, JWT refresh, multi-device sessions, and
      security roles
  - name: Organization & Branches
    description: Multi-tenant organization registration, metadata settings, and
      branch isolation
  - name: CRM & Customers
    description: Customer profiles, credit limits, outstanding balances, and
      supplier directories
  - name: Inventory & Products
    description: Catalog items, multi-branch stock levels, barcode scanning,
      purchases, and sales
  - name: Accounting & Invoicing
    description: GST invoices, PDF generation, customer receipts, Chart of Accounts,
      ledgers, EMI, and reconciliation
  - name: Storefront (Public & Admin)
    description: Customer-facing store catalog, checkout, orders, CMS pages, and
      builder themes
  - name: Delivery & Logistics
    description: Last-mile delivery agent dispatch, package tracking, and shipment manifests
  - name: HRMS Suite
    description: Employee master 360, departments, designations, company assets, and
      documents
  - name: HRMS - Attendance
    description: Real-time biometric punch, daily logs, hardware machines, and GPS geofences
  - name: HRMS - Leaves
    description: Leave application workflows, manager approvals, and quota balances
  - name: HRMS - Payroll
    description: Monthly payroll calculation runs, employee payslips, and salary structures
  - name: Team Chat
    description: Internal team communication channels, direct messaging, and media uploads
  - name: AI Agent & Intelligence
    description: Natural language CRM business intelligence with live database tool
      execution
  - name: Analytics & BI
    description: Executive revenue dashboard, profit analysis, stock health, and
      dead-stock predictions
  - name: Collaboration & Workspace
    description: Notes, task boards, team meeting scheduling, and knowledge templates
  - name: Field Service
    description: Work assignments, technician dispatch tickets, and SLA monitoring
  - name: Media & Assets
    description: Cloudinary storage, file uploads, asset tagging, and CDN management
  - name: Notifications & Broadcasts
    description: User notification feeds, unread badges, and organization broadcasts
  - name: Webhooks
    description: Webhook subscription endpoints, event deliveries, and replay audits
  - name: Master Data & Dropdowns
    description: High-speed key-value lookup dropdowns for forms and filters
  - name: Global Search
    description: Instant multi-entity search across customers, products, and invoices
  - name: Admin Platform
    description: Superadmin controls, tenant overview, cache flush, and database inspector
  - name: System Operations
    description: Background cron job monitors, application log streaming, and system
      dashboards
  - name: Health & Diagnostics
    description: Liveness probes, MongoDB socket status, and cache diagnostics
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Enter your JWT token as: Bearer <token>"
    TenantId:
      type: apiKey
      in: header
      name: x-organization-id
      description: "Informational client context header. Note: Authoritative tenant
        isolation is always enforced strictly from the authenticated Bearer JWT
        claim."
  schemas:
    ApiResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Operation completed successfully
        data:
          type: object
    ApiError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: RESOURCE_NOT_FOUND
            message:
              type: string
              example: The requested record does not exist
            details:
              type: object
    PaginationMeta:
      type: object
      properties:
        total:
          type: number
          example: 120
        page:
          type: number
          example: 1
        limit:
          type: number
          example: 20
        totalPages:
          type: number
          example: 6
    LoginRequest:
      type: object
      required:
        - email
        - password
        - uniqueShopId
      properties:
        email:
          type: string
          format: email
          example: user@shivam.com
          description: User registered email address (or phone number)
        password:
          type: string
          format: password
          example: SuperSecurePassword123!
          description: User account password
        uniqueShopId:
          type: string
          example: shivam
          description: Your unique Shop ID or shop name (e.g. "shivam"). Required for
            every user to authenticate into their specific organization
            workspace.
        organizationSlug:
          type: string
          example: shivam
          description: Organization slug (alias for uniqueShopId, e.g. "shivam")
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          example: d3b07384d113edec49eaa6238ad5ff00...
        expiresIn:
          type: number
          example: 86400
        sessionId:
          type: string
          example: ses-65e123abc
        user:
          type: object
          properties:
            id:
              type: string
              example: usr-001
            email:
              type: string
              example: user@shivam.com
            name:
              type: string
              example: System Administrator
            role:
              type: string
              example: admin
            roles:
              type: array
              items:
                type: string
              example:
                - admin
            organizationId:
              type: string
              example: org-main
            uniqueShopId:
              type: string
              example: shivam
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: Shivam Patel
        email:
          type: string
          format: email
          example: shivam@apex.local
        password:
          type: string
          minLength: 8
          example: SuperSecurePassword123!
        passwordConfirm:
          type: string
          example: SuperSecurePassword123!
        uniqueShopId:
          type: string
          example: shivam
        organizationSlug:
          type: string
          example: shivam
        organizationName:
          type: string
          example: Shivam Retailers
        organizationId:
          type: string
          example: org-65e123
        phone:
          type: string
          example: "+919876543210"
        roles:
          type: array
          items:
            type: string
          example:
            - user
    UpdatePasswordRequest:
      type: object
      required:
        - passwordCurrent
        - password
      properties:
        passwordCurrent:
          type: string
          example: OldSuperSecurePassword123!
        password:
          type: string
          minLength: 8
          example: NewSuperSecurePassword456!
        passwordConfirm:
          type: string
          example: NewSuperSecurePassword456!
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: user@shivam.com
    ResetPasswordRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          minLength: 8
          example: NewSuperSecurePassword456!
        passwordConfirm:
          type: string
          example: NewSuperSecurePassword456!
    CreateOrganizationRequest:
      type: object
      required:
        - organizationName
        - ownerName
        - ownerEmail
        - ownerPassword
      properties:
        organizationName:
          type: string
          example: Shivam Electronics Pvt Ltd
        slug:
          type: string
          example: shivam-electronics
        uniqueShopId:
          type: string
          example: shivam
        primaryEmail:
          type: string
          format: email
          example: owner@shivam.com
        primaryPhone:
          type: string
          example: "+919876543210"
        gstNumber:
          type: string
          example: 27AAAAA0000A1Z5
        mainBranchName:
          type: string
          example: Main Headquarters
        mainBranchAddress:
          type: object
          properties:
            street:
              type: string
              example: MG Road
            city:
              type: string
              example: Mumbai
            state:
              type: string
              example: Maharashtra
            zipCode:
              type: string
              example: "400001"
            country:
              type: string
              example: India
        ownerName:
          type: string
          example: Shivam Patel
        ownerEmail:
          type: string
          format: email
          example: owner@shivam.com
        ownerPassword:
          type: string
          minLength: 8
          example: SuperSecurePassword123!
    CreateOrganizationResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            organization:
              type: object
              properties:
                id:
                  type: string
                  example: org-65e123
                name:
                  type: string
                  example: Shivam Electronics Pvt Ltd
                slug:
                  type: string
                  example: shivam-electronics
                uniqueShopId:
                  type: string
                  example: shivam
                primaryEmail:
                  type: string
                  example: owner@shivam.com
            owner:
              type: object
              properties:
                id:
                  type: string
                  example: usr-65e123
                name:
                  type: string
                  example: Shivam Patel
                email:
                  type: string
                  example: owner@shivam.com
            accessToken:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            refreshToken:
              type: string
              example: d3b07384d113edec49eaa6238ad5ff00...
            setup:
              type: object
              properties:
                branch:
                  type: string
                role:
                  type: string
                shift:
                  type: string
                department:
                  type: string
                designation:
                  type: string
    UpdateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          example: Shivam Global Enterprises
        primaryEmail:
          type: string
          format: email
          example: contact@shivam.com
        primaryPhone:
          type: string
          example: "+919876543210"
        secondaryEmail:
          type: string
          format: email
        secondaryPhone:
          type: string
        gstNumber:
          type: string
          example: 27AAAAA0000A1Z5
        uniqueShopId:
          type: string
          example: shivam
        logo:
          type: string
          format: uri
        address:
          type: object
          properties:
            street:
              type: string
            city:
              type: string
            state:
              type: string
            zipCode:
              type: string
            country:
              type: string
        settings:
          type: object
          properties:
            currency:
              type: string
              example: INR
            timezone:
              type: string
              example: Asia/Kolkata
            financialYearStart:
              type: string
              example: 04-01
        platformDelivery:
          type: object
          properties:
            enabled:
              type: boolean
              example: true
    CreateBranchRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Andheri West Warehouse
        branchCode:
          type: string
          example: AND-001
        address:
          type: object
          properties:
            street:
              type: string
              example: Link Road
            city:
              type: string
              example: Mumbai
            state:
              type: string
              example: Maharashtra
            zipCode:
              type: string
              example: "400053"
            country:
              type: string
              example: India
        phone:
          type: string
          example: "+919876543211"
        email:
          type: string
          format: email
          example: branch.andheri@shivam.com
        isMainBranch:
          type: boolean
          default: false
    BranchResponse:
      type: object
      properties:
        id:
          type: string
          example: br-65e123
        organizationId:
          type: string
          example: org-65e123
        name:
          type: string
          example: Andheri West Warehouse
        branchCode:
          type: string
          example: AND-001
        phone:
          type: string
        email:
          type: string
        isMainBranch:
          type: boolean
          example: false
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john.doe@shivam.com
        password:
          type: string
          minLength: 8
          example: TempPass123!
        role:
          type: string
          example: staff
        roles:
          type: array
          items:
            type: string
          example:
            - staff
        department:
          type: string
          example: Sales
        designation:
          type: string
          example: Sales Executive
        phone:
          type: string
          example: "+919876543212"
        branchId:
          type: string
          example: br-65e123
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          example: John Doe
        phone:
          type: string
          example: "+919876543212"
        role:
          type: string
          example: manager
        department:
          type: string
          example: Sales
        designation:
          type: string
          example: Senior Sales Executive
        branchId:
          type: string
          example: br-65e123
        isActive:
          type: boolean
          example: true
    CreateRoleRequest:
      type: object
      required:
        - name
        - permissions
      properties:
        name:
          type: string
          example: Store Manager
        description:
          type: string
          example: Manages sales orders, inventory, and storefront
        permissions:
          type: array
          items:
            type: string
          example:
            - product:read
            - product:create
            - sales:manage
            - customer:read
        isDefault:
          type: boolean
          default: false
        isSuperAdmin:
          type: boolean
          default: false
    InitiateOwnershipTransferRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          description: User ID of the nominated owner within the same organization
          example: usr-65e456
    FinalizeOwnershipTransferRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: One-time secure transfer token sent to new owner email
          example: 3f7b2c9a8d4e5f60718293a4b5c6d7e8
    CreateProductRequest:
      type: object
      required:
        - name
        - sellingPrice
        - category
      properties:
        name:
          type: string
          example: Wireless Bluetooth Mouse
        sku:
          type: string
          example: MSE-WL-001
        category:
          type: string
          example: Electronics
        brand:
          type: string
          example: Logitech
        sellingPrice:
          type: number
          example: 799
        purchasePrice:
          type: number
          example: 450
        taxRate:
          type: number
          example: 18
        initialStock:
          type: number
          example: 50
    ProductResponse:
      type: object
      properties:
        _id:
          type: string
          example: prod-65e123456789
        name:
          type: string
          example: Wireless Bluetooth Mouse
        sku:
          type: string
          example: MSE-WL-001
        sellingPrice:
          type: number
          example: 799
        totalStock:
          type: number
          example: 50
        isActive:
          type: boolean
          example: true
    CreateInvoiceRequest:
      type: object
      required:
        - customerId
        - items
      properties:
        customerId:
          type: string
          example: cust-65e123
        invoiceDate:
          type: string
          format: date
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              quantity:
                type: number
                example: 2
              unitPrice:
                type: number
                example: 799
              taxRate:
                type: number
                example: 18
        notes:
          type: string
          example: Payment due upon receipt.
    InvoiceResponse:
      type: object
      properties:
        _id:
          type: string
          example: inv-65e987
        invoiceNumber:
          type: string
          example: INV-2026-0001
        grandTotal:
          type: number
          example: 1885.64
        paymentStatus:
          type: string
          example: unpaid
    AiChatPromptRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: What is our total revenue this month and how many invoices are unpaid?
    AiChatPromptResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        reply:
          type: string
          example: "Apex AI Intelligence: Total revenue is ₹2,45,000 across 28 invoices.
            Currently 4 invoices are unpaid totaling ₹32,000."
        toolsUsed:
          type: array
          items:
            type: string
          example:
            - SalesAnalyticsTool
            - CustomerBalanceTool
        data:
          type: object
        timestamp:
          type: string
          format: date-time
    ChatMessagePayload:
      type: object
      required:
        - channelId
        - body
      properties:
        channelId:
          type: string
          example: chan-001
        body:
          type: string
          example: Team, please review the latest inventory shipment reports.
        attachments:
          type: array
          items:
            type: object
    AnalyticsDashboardOverview:
      type: object
      properties:
        totalRevenue:
          type: number
          example: 450000
        netProfit:
          type: number
          example: 125000
        totalOrders:
          type: number
          example: 142
        activeCustomers:
          type: number
          example: 89
        inventoryValuation:
          type: number
          example: 380000
        totalReceivables:
          type: number
          example: 42000
        lastUpdated:
          type: string
          format: date-time
security:
  - BearerAuth: []
    TenantId: []
paths:
  /health:
    get:
      tags:
        - Health & Diagnostics
      summary: System health check and database connection status
      security: []
      responses:
        "200":
          description: System is healthy and database is connected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  uptimeSeconds:
                    type: number
                    example: 3600
  /auth/login:
    post:
      tags:
        - Authentication & Identity
      summary: Authenticate with email, password, and Shop ID (e.g. "shivam")
      description: Generates access and refresh tokens. Every user belongs to a
        specific tenant shop. Users must supply their uniqueShopId (or
        organizationSlug) alongside email and password to authenticate into
        their workspace.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Missing email, password, or Shop ID
        "401":
          description: Invalid credentials, shop mismatch, or account suspended
        "404":
          description: Specified Shop ID or organization does not exist
  /auth/register:
    post:
      tags:
        - Authentication & Identity
      summary: Register new tenant user / member
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /auth/signup:
    post:
      tags:
        - Authentication & Identity
      summary: User registration alias (public signup)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /auth/refresh-token:
    post:
      tags:
        - Authentication & Identity
      summary: Exchange refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Refresh token string (or read from HTTP-only cookie)
      responses:
        "200":
          description: New access token generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /auth/forgot-password:
    post:
      tags:
        - Authentication & Identity
      summary: Request password reset link via email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Password reset email dispatched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  "/auth/reset-password/{token}":
    patch:
      tags:
        - Authentication & Identity
      summary: Reset password using valid reset token
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: Password reset opaque token
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /auth/verify-token:
    get:
      tags:
        - Authentication & Identity
      summary: Validate active access token state
      responses:
        "200":
          description: Token is valid and active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  "/auth/verify-email/{token}":
    get:
      tags:
        - Authentication & Identity
      summary: Verify user email address from registration token
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: Email verification token
          schema:
            type: string
      responses:
        "200":
          description: Email address confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /auth/update-my-password:
    patch:
      tags:
        - Authentication & Identity
      summary: Update password for current authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePasswordRequest"
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /auth/send-verification-email:
    post:
      tags:
        - Authentication & Identity
      summary: Resend email verification link to current authenticated user
      responses:
        "200":
          description: Verification email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /auth/logout:
    post:
      tags:
        - Authentication & Identity
      summary: Invalidate current session and logout
      responses:
        "200":
          description: Session closed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /auth/logout-all:
    post:
      tags:
        - Authentication & Identity
      summary: Invalidate all active sessions across all devices
      responses:
        "200":
          description: All sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /auth/me:
    get:
      tags:
        - Authentication & Identity
      summary: Get active user profile and permission manifest
      responses:
        "200":
          description: Active profile data
          content:
            application/json:
